services:
  # ─── Backend Web Service (Node.js + Express + PostgreSQL) ──────────────────
  - type: web
    name: geu-alumni-backend
    env: node
    region: oregon # Or your preferred Render region (e.g., frankfurt, singapore)
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # You will input your NeonDB PostgreSQL URL in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure 256-bit random secret
      - key: BASE_URL
        value: https://geu-alumni-backend.onrender.com
      - key: FRONTEND_URL
        value: https://geu-alumni-frontend.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Input your Cloudinary Cloud Name in Dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # Input your Cloudinary API Key in Dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # Input your Cloudinary API Secret in Dashboard
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false # Optional: Gmail address (leave blank for console fallback mode)
      - key: SMTP_PASS
        sync: false # Optional: Gmail App Password
      - key: EMAIL_FROM
        value: "GEU Alumni Connect <no-reply@geu-alumni.onrender.com>"

  # ─── Frontend Static Site (React + Vite + TypeScript) ──────────────────────
  - type: web
    name: geu-alumni-frontend
    env: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://geu-alumni-backend.onrender.com
